<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rameen Property - Aurangabad</title>
  <style>
    body{margin:0;font-family:sans-serif;background:#f1f3f6}
    .h{background:#0f2a44;color:#fff;padding:12px;text-align:center}
    .logo{color:#e8b631;font-weight:800;font-size:22px}
    .sub{font-size:12px;opacity:.8}
    .menu{
      display:flex;gap:8px;overflow:auto;
      padding:10px;background:#fff;
      border-bottom:1px solid #ddd;
      position:sticky;top:0;z-index:5
    }
    .menu button{
      white-space:nowrap;border:1px solid #0f2a44;
      background:#fff;color:#0f2a44;
      padding:8px 14px;border-radius:20px;
      font-weight:700
    }
    .menu button.active{background:#0f2a44;color:#fff}
    
    /* ✅ TIK 1 - BROKER BUTTON STYLE */
    .broker-btn{
      background:#e8b631!important;
      color:#000!important;
      border-color:#e8b631!important;
    }
    .list{
      display:grid;gap:12px;
      max-width:1100px;margin:auto;padding:12px
    }
    @media(min-width:700px){
      .list{grid-template-columns:1fr 1fr}
    }
    .card{
      background:#fff;border-radius:12px;
      overflow:hidden;border:1px solid #ddd
    }
    .card img{width:100%;height:180px;object-fit:cover}
    .card-body{padding:10px}
    .price{color:#128c4f;font-weight:700}
    .wa{
      background:#128c4f;color:#fff;display:block;
      text-align:center;padding:8px;border-radius:8px;
      text-decoration:none;margin-top:6px;font-weight:700
    }
    .modal{
      position:fixed;inset:0;
      background:rgba(0,0,0,.6);
      display:none;place-items:center;
      padding:15px;z-index:99;overflow:auto
    }
    .modal.open{display:grid}
    .mbox{
      background:#fff;border-radius:12px;
      padding:16px;max-width:450px;width:100%
    }
    .mbox input,.mbox select,.mbox textarea{
      width:100%;padding:10px;margin:4px 0;
      border-radius:8px;border:1px solid #ccc;
      box-sizing:border-box
    }
    .btn-save{
      background:#0f2a44;color:#fff;border:0;
      padding:12px;width:100%;border-radius:8px;
      font-weight:800
    }
