<style>

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#101410;--card:#1e251d;--text:#f1ede2;--muted:#a3ad9f;--line:#2f3a2e;--input:#141a14;--shadow:0 6px 24px rgba(0,0,0,.4);}
}
:root[data-theme="dark"]{--bg:#101410;--card:#1e251d;--text:#f1ede2;--muted:#a3ad9f;--line:#2f3a2e;--input:#141a14;--shadow:0 6px 24px rgba(0,0,0,.4);}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Playfair Display',Georgia,'Times New Roman',serif;margin:0 0 .4em;line-height:1.2}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#0c100c;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.brand{text-decoration:none;color:var(--text);display:flex;align-items:center;gap:10px}
.brand svg{width:28px;height:34px;flex:none;color:var(--gold)}
.brand span{display:block}
.brand b{font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:600;letter-spacing:.14em;display:block;line-height:1.1;color:var(--text)}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.34em;text-transform:uppercase;margin-top:4px}
.phone-link{background:var(--gold);color:var(--navy);font-weight:700;text-decoration:none;padding:8px 11px;border-radius:999px;font-size:12px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
nav.menu{display:none;flex-direction:column;gap:2px;padding:0 0 12px}nav.menu.open{display:flex}
.top-actions{display:flex;align-items:center;gap:8px}
.burger{width:42px;height:42px;border:1px solid var(--line);background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
.burger span,.burger span:before,.burger span:after{display:block;width:20px;height:2px;background:var(--text);content:"";position:relative}
.burger span:before{position:absolute;top:-6px}.burger span:after{position:absolute;top:6px}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--gold);font-size:12px;letter-spacing:.26em;text-transform:uppercase;font-weight:600;margin-bottom:10px}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;padding:7px 13px;border-radius:999px;white-space:nowrap}
nav.menu a.on,nav.menu a:hover{background:rgba(201,168,106,.22);color:var(--text)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:inherit;font-weight:700;text-decoration:none;border-radius:12px;padding:12px 20px;font-size:15px;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.98)}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy);box-shadow:0 4px 16px rgba(201,168,106,.35)}
.btn-navy{background:var(--navy);color:var(--gold2);border:1px solid var(--gold)}
.btn-ghost{background:transparent;color:var(--gold2);border:1.5px solid var(--gold)}
.btn-wa{background:#25d366;color:#07351b}
.btn-call{background:var(--navy);color:var(--gold2)}
.btn-ok{background:#1f9d5c;color:#fff}.btn-no{background:#c0392b;color:#fff}.btn-del{background:transparent;color:#c0392b;border:1.5px solid #c0392b}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn-lg{padding:16px 26px;font-size:17px;border-radius:14px}
.btn-block{width:100%}
svg.i{width:18px;height:18px;flex:none}

/* hero */
.hero{background:radial-gradient(1200px 500px at 80% -10%,rgba(201,168,106,.22),transparent 60%),linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:48px 0 56px;text-align:left}
.hero .tag{display:flex;align-items:center;gap:14px;color:var(--gold);font-size:12px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:18px}
.hero .tag:before{content:"";width:48px;height:1px;background:var(--gold)}
.hero h1{font-size:clamp(38px,10vw,68px);color:var(--text);font-weight:500}
.hero h1 em{color:var(--gold);font-style:italic}
.hero p{color:var(--muted);max-width:560px;margin:0 0 24px;font-size:16px}
.cta-stack{display:flex;flex-direction:column;gap:12px;max-width:440px;margin:0}
.stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px;margin:30px 0 0}
.stats-strip div{background:rgba(255,255,255,.06);border:1px solid rgba(201,168,106,.35);border-radius:14px;padding:12px 6px}
.stats-strip b{display:block;font-family:'Playfair Display',serif;font-size:22px;color:var(--gold2)}
.stats-strip span{font-size:11.5px;color:#9fb0cc}
section.block{padding:38px 0}
.sec-title{text-align:center;margin-bottom:22px}
.sec-title h2{font-size:clamp(22px,4.5vw,32px)}
.sec-title h2:after{content:"";display:block;width:56px;height:3px;background:var(--gold);margin:10px auto 0;border-radius:3px}
.features{display:grid;gap:14px;grid-template-columns:1fr}
.feat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.feat .ic{width:44px;height:44px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:22px;margin-bottom:10px}
.feat h3{font-size:18px}.feat p{margin:0;color:var(--muted);font-size:14.5px}
.page-head{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:28px 0 64px;text-align:center}
.page-head h1{color:var(--gold);font-size:clamp(22px,5vw,38px);letter-spacing:.04em}
.page-head p{margin:0;color:#b8c6de;font-size:15px}
.search{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin:-44px auto 22px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.search .full{grid-column:1/-1}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field label em{color:#c0392b;font-style:normal}
input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--text);background:var(--input);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,106,.25)}
textarea{min-height:100px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px;max-width:640px;margin:-40px auto 40px}
.row2{display:grid;grid-template-columns:1fr;gap:0 12px}
.err{color:#c0392b;font-size:13px;margin:6px 0 0;min-height:18px}
.count{color:var(--muted);font-size:14px;margin:0 2px 12px}
.grid{display:grid;grid-template-columns:1fr;gap:18px;margin-bottom:46px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card .img{position:relative;aspect-ratio:16/10;background:var(--navy);cursor:pointer;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .img img{transform:scale(1.04)}
.badge{position:absolute;left:10px;top:10px;background:var(--gold);color:var(--navy);font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:999px;letter-spacing:.03em}
.badge.feat-b{background:var(--navy);color:var(--gold2);left:auto;right:10px;border:1px solid var(--gold)}
.card .body{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:17px;margin:0;cursor:pointer}
.loc{color:var(--muted);font-size:13.5px}
.price{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:var(--text)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(201,168,106,.15);border:1px solid rgba(201,168,106,.5);color:var(--text);font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:8px}
.broker{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:9px;margin-top:auto}
.broker b{color:var(--text)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:'Playfair Display',serif;font-size:28px;color:var(--gold)}
:root .stat b{color:#a8832f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat b{color:var(--gold)}}
:root[data-theme="dark"] .stat b{color:var(--gold)}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lrow{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}

.lrow .info span{font-size:12.5px;color:var(--muted)}

.sec-h h2{font-size:22px;margin:0}
.alist .lrow{flex-wrap:wrap}
.alist .btns{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.drop{border:2px dashed var(--gold);border-radius:12px;padding:16px;text-align:center;background:rgba(201,168,106,.07);cursor:pointer;font-size:14px;color:var(--muted)}
.previews{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pv{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.pv img{width:100%;height:100%;object-fit:cover}
.pv button{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(10,25,47,.85);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.success{text-align:center;padding:10px 0}
.success .tick{width:64px;height:64px;border-radius:50%;background:#1f9d5c;color:#fff;display:grid;place-items:center;font-size:34px;margin:0 auto 14px}
.overlay{position:fixed;inset:0;background:rgba(3,10,22,.72);z-index:100;display:none;align-items:flex-end;justify-content:center;padding:0}
.overlay.show{display:flex}
.modal{background:var(--card);color:var(--text);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;position:relative;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px}
.kv span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
footer{background:var(--navy);color:#9fb0cc;text-align:center;padding:26px 16px 96px;border-top:2px solid var(--gold);font-size:13.5px}
footer b{color:var(--gold);font-family:'Playfair Display',serif;letter-spacing:.06em;font-size:16px}
footer a{color:var(--gold2)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:90;text-decoration:none;animation:pulse 2.4s infinite}
.fab svg{width:32px;height:32px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55),0 6px 20px rgba(0,0,0,.35)}70%{box-shadow:0 0 0 16px rgba(37,211,102,0),0 6px 20px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0),0 6px 20px rgba(0,0,0,.35)}}
@media(min-width:640px){
  .search{grid-template-columns:repeat(4,1fr)}
  .search .full{grid-column:auto}
  .grid{grid-template-columns:repeat(2,1fr)}
  .features{grid-template-columns:repeat(3,1fr)}
  .row2{grid-template-columns:1fr 1fr}

  .cta-stack{flex-direction:row;max-width:640px}

  .brand b{font-size:27px;letter-spacing:.2em}.brand small{font-size:10px}.brand svg{width:38px;height:46px}nav.menu{display:flex!important;flex-direction:row;padding:0 0 8px}.burger{display:none!important}
  .overlay{align-items:center;padding:20px}.modal{border-radius:22px;max-width:620px}
}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>

function art(type,n){
  var pal={'JV Project':['#0a192f','#c9a86a'],'Sale':['#0a192f','#3d6fa3'],'Rent':['#0a192f','#3f8f78'],'Commercial':['#0a192f','#a8702f']}[type]||['#0a192f','#c9a86a'];
  var h=[90,140,110,170,120,150,100], x=24, bars='';
  for(var i=0;i<7;i++){
    var hh=h[(i+n)%7], w=38;
    bars+='<rect x="'+x+'" y="'+(230-hh)+'" width="'+w+'" height="'+hh+'" fill="#fff" fill-opacity="'+(0.10+0.04*(i%3))+'"/>';
    for(var r=0;r<Math.floor(hh/24);r++){
      bars+='<rect x="'+(x+8)+'" y="'+(240-hh+r*24)+'" width="8" height="10" fill="#e2c994" fill-opacity=".7"/><rect x="'+(x+22)+'" y="'+(240-hh+r*24)+'" width="8" height="10" fill="#e2c994" fill-opacity=".45"/>';
    }
    x+=51;
  }
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+pal[0]+'"/><stop offset="1" stop-color="'+pal[1]+'"/></linearGradient></defs><rect width="400" height="250" fill="url(#g)"/><circle cx="330" cy="50" r="22" fill="#e2c994" fill-opacity=".55"/>'+bars+'<rect y="230" width="400" height="20" fill="#000" fill-opacity=".25"/></svg>';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(s);
}

function api(path,opt){
  opt=opt||{};
  var h=Object.assign({apikey:CFG.KEY,Authorization:'Bearer '+CFG.KEY,'Content-Type':'application/json'},opt.headers||{});
  return fetch(CFG.URL+path,Object.assign({},opt,{headers:h})).then(function(r){

      if(!r.ok)throw new Error(t||r.status);
      return t?JSON.parse(t):null;

  });
}

  if(p==='/broker-dashboard'&&db.meId)return rpc('my_listings',{p_broker_id:db.meId}).then(function(rows){setRemote(rows.map(mapRow))});

  return Promise.resolve();

function grid(){
  var L=db.listings.filter(function(l){
    if(l.status!=='Approved')return false;
    if(F.loc&&l.location!==F.loc)return false;
    if(F.type&&l.type!==F.type)return false;
    if(F.bhk&&l.bhk!==F.bhk)return false;
    if(F.budget&&l.price>0){
      var p=l.price;
      if(F.budget==='u25'&&!(p<2500000))return false;
      if(F.budget==='25'&&!(p>=2500000&&p<5000000))return false;
      if(F.budget==='50'&&!(p>=5000000&&p<10000000))return false;
      if(F.budget==='o1'&&!(p>=10000000))return false;
    }
    return true;
  }).sort(function(a,b){return (b.featured?1:0)-(a.featured?1:0)||b.created-a.created});
  $('#cnt').textContent=L.length+(L.length===1?' property found':' properties found');
  $('#grid').innerHTML=L.length?L.map(card).join(''):'<div class="empty" style="grid-column:1/-1">No properties match your search. Try changing the filters.</div>';
}

      var msg='New listing for approval\nTitle: '+l.title+'\nLocation: '+l.location+'\nType: '+l.type+'\nPrice: '+(l.priceLabel||money(l.price))+(l.perMonth?' / month':'')+'\nSize: '+l.size+' sqm\nBHK: '+(bhkText(l)||'N/A')+'\nOwner contact: '+l.owner+'\nBroker: '+b.name+' ('+b.phone+'), '+b.company+(b.rera?' RERA '+b.rera:'')+'\nPhotos: '+l.photos.length+(l.desc?'\nDescription: '+l.desc:'');
      var note=REMOTE?'Status: Pending. Rameen admin can now see your listing and will approve it soon.':'Status: Pending. Tap the green button so Rameen receives your listing details instantly on WhatsApp (send photos in the same chat).';
      $('.form-card').innerHTML='<div class="success"><div class="tick">✓</div><h2>Listing Submitted</h2><p style="font-size:16px"><b>Listing sent to Rameen for approval - Call 9545247374</b></p><p class="hint">'+note+'</p><div style="display:grid;gap:10px;margin-top:18px"><a class="btn btn-wa btn-lg" target="_blank" rel="noopener" href="'+waLink(WA,msg)+'">'+IC.wa+' Send details to Rameen on WhatsApp</a><a class="btn btn-call btn-lg" href="tel:+919545247374">'+IC.call+' Call 9545247374</a><a class="btn btn-gold" href="#/broker-dashboard">Go to My Dashboard</a><a class="btn btn-ghost" style="color:var(--text);border-color:var(--line)" href="#/add-listing">+ Add Another Listing</a></div></div>';
      window.scrollTo(0,0);
    }
    if(REMOTE){
      btn.disabled=true;btn.textContent='Submitting…';er.textContent='';
      var row={id:l.id,data:l,status:'Pending',broker_id:b.id,views:0,created:l.created};
      api('/rest/v1/listings',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(row)}).then(done).catch(function(){btn.disabled=false;btn.textContent='Submit Listing for Approval';er.textContent='Could not submit. Check your internet and try again.'});
      return;
    }
    db.listings.push(l);
    if(!save()){db.listings.pop();er.textContent='Storage is full. Please remove some photos and try again.';return}
    done();
  });
}
function prev(){
  var p=$('#pv');if(!p)return;
  p.innerHTML=photos.map(function(s,i){return '<div class="pv"><img src="'+s+'" alt=""><button type="button" data-act="rmphoto" data-i="'+i+'" aria-label="Remove">×</button></div>'}).join('');
}
function aRow(l,btns){
  var br=db.brokers.filter(function(b){return b.id===l.brokerId})[0];
  var ph=br?br.phone:l.brokerPhone;
  return '<div class="lrow"><img src="'+imgOf(l)+'" alt=""><div class="info"><b>'+esc(l.title)+'</b><span>'+esc(l.location)+' · '+esc(l.type)+' · '+priceHtml(l).replace(/<[^>]+>/g,'')+'<br>By '+esc(l.brokerName)+' · <a href="tel:+91'+digits(ph)+'">'+esc(ph)+'</a> · Owner: '+esc(l.owner)+'</span></div><div class="btns">'+btns+'</div></div>';
}
function pAdmin(){
  if(!isAdmin()){
    app.innerHTML=
    '<div class="wrap" style="padding:36px 16px 40px"><form class="form-card" id="lf" style="max-width:520px;margin:0 auto">'+
    '<div style="width:56px;height:56px;color:var(--gold);margin-bottom:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1" fill="currentColor"/></svg></div>'+
    '<div class="eyebrow">Invited admins only</div><h1 style="font-size:clamp(30px,8vw,44px)">Administrator login</h1>'+
    '<p style="color:var(--muted);margin:0 0 20px">Sign in to review and manage the property network.</p>'+
    '<div class="field"><label>Email address</label><input id="ad-em" type="email" autocomplete="username" value="RAMEENPROPERTY@gmail.com"></div>'+
    '<div class="field"><label>Password</label><div style="position:relative"><input id="ad-pw" type="password" autocomplete="current-password" placeholder="Enter your password" style="padding-right:48px"><button type="button" id="ad-eye" aria-label="Show password" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--gold);cursor:pointer;font-size:18px;padding:6px">👁</button></div></div>'+
    '<p class="err" id="ad-err"></p><button class="btn btn-gold btn-block btn-lg" type="submit">Sign in to admin panel →</button>'+
    '<p class="hint" style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px">Here to share a property? <a href="#/add-listing" style="color:var(--gold2)">Add a listing ↗</a></p></form></div>';
    $('#ad-eye').addEventListener('click',function(){var i=$('#ad-pw');i.type=i.type==='password'?'text':'password'});
    $('#lf').addEventListener('submit',function(e){
      e.preventDefault();
      var em=$('#ad-em').value.trim().toLowerCase(),pw=$('#ad-pw').value,er=$('#ad-err');
      var bad='Sign-in failed. Check your email and password.';
      if(em!==ADMIN_EMAIL){er.textContent=bad;return}
      if(REMOTE){rpc('admin_data',{p:pw}).then(function(){setPw(pw);render()}).catch(function(){er.textContent=bad})}
      else if(pw===ADMIN_PW){ss(K.a,true);pAdmin()}
      else er.textContent=bad;
    });
    return;
  }
  var AL=db.listings.filter(function(l){return !(REMOTE&&l.brokerId==='rameen')});
  var P=AL.filter(function(l){return l.status==='Pending'}),A=AL.filter(function(l){return l.status==='Approved'}),R=AL.filter(function(l){return l.status==='Rejected'});
  app.innerHTML=head('Admin Dashboard','Manage brokers and listings')+
  '<div class="wrap alist" style="padding-bottom:40px">'+
   '<div class="stat-grid" style="margin-top:-40px;grid-template-columns:repeat(3,1fr)">'+
    '<div class="stat"><b>'+AL.length+'</b><span>Total Listings</span></div>'+
    '<div class="stat"><b>'+db.brokers.length+'</b><span>Total Brokers</span></div>'+
    '<div class="stat"><b>'+P.length+'</b><span>Pending</span></div>'+
   '</div>'+
   '<div class="sec-h"><h2>Pending Listings ('+P.length+')</h2><button class="btn btn-ghost btn-sm" style="color:var(--text);border-color:var(--line)" data-act="adminout">Logout</button></div>'+
   (P.length?P.map(function(l){return aRow(l,'<button class="btn btn-ok btn-sm" data-act="approve" data-id="'+l.id+'">✓ Approve</button><button class="btn btn-no btn-sm" data-act="reject" data-id="'+l.id+'">✕ Reject</button><button class="btn btn-ghost btn-sm" style="color:var(--text);border-color:var(--line)" data-act="open" data-id="'+l.id+'" data-noview="1">Details</button>')}).join(''):'<div class="empty">No pending listings.</div>')+
   '<div class="sec-h"><h2>Approved Listings ('+A.length+')</h2></div>'+
   (A.length?A.map(function(l){return aRow(l,'<button class="btn btn-del btn-sm" data-act="delete" data-id="'+l.id+'">🗑 Delete</button>')}).join(''):'<div class="empty">No approved listings.</div>')+
   (R.length?'<div class="sec-h"><h2>Rejected ('+R.length+')</h2></div>'+R.map(function(l){return aRow(l,'<button class="btn btn-ok btn-sm" data-act="approve" data-id="'+l.id+'">Approve</button><button class="btn btn-del btn-sm" data-act="delete" data-id="'+l.id+'">🗑 Delete</button>')}).join(''):'')+
   '<div class="sec-h"><h2>All Brokers ('+db.brokers.length+')</h2></div>'+
   (db.brokers.length?'<div class="tbl"><table><thead><tr><th>Name</th><th>Phone</th><th>Company</th><th>RERA</th><th>City</th><th>Listings</th></tr></thead><tbody>'+db.brokers.map(function(b){return '<tr><td>'+esc(b.name)+'</td><td><a href="tel:+91'+b.phone+'">'+esc(b.phone)+'</a></td><td>'+esc(b.company)+'</td><td>'+esc(b.rera||'—')+'</td><td>'+esc(b.city)+'</td><td>'+AL.filter(function(l){return l.brokerId===b.id}).length+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">No brokers registered yet.</div>')+
  '</div>';
}
function openL(id,noView){
  var l=db.listings.filter(function(x){return x.id===id})[0];if(!l)return;
  if(!noView&&l.status==='Approved'){l.views=(l.views||0)+1;save();if(REMOTE&&l.brokerId!=='rameen')rpc('add_view',{p_id:l.id}).catch(function(){})}
  var n=(l.photos&&l.photos.length)||1,b=bhkText(l);
  var th=n>1?'<div class="thumbs">'+l.photos.map(function(s,i){return '<img src="'+s+'" data-act="thumb" data-i="'+i+'" class="'+(i===0?'on':'')+'" alt="">'}).join('')+'</div>':'';
  $('#modal').innerHTML='<button class="x" data-act="close" aria-label="Close">×</button><img class="mi" id="mi" src="'+imgOf(l)+'" alt="">'+th+
   '<div class="mb"><span class="chip">'+esc(l.type)+'</span><h2 style="margin-top:10px">'+esc(l.title)+'</h2><div class="loc">📍 '+esc(l.location)+', Chhatrapati Sambhajinagar</div><div class="price" style="margin:8px 0">'+priceHtml(l)+'</div>'+
   '<div class="kv"><div><span>Size</span>'+esc(l.size)+' sqm</div><div><span>Config</span>'+(b||'—')+'</div><div><span>Broker</span>'+esc(l.brokerName)+'</div><div><span>Views</span>'+(l.views||0)+'</div></div>'+
   (l.desc?'<p style="font-size:14.5px;color:var(--muted);white-space:pre-line">'+esc(l.desc)+'</p>':'')+
   '<div class="actions" style="margin-top:12px"><a class="btn btn-call" href="tel:+91'+PHONE+'">'+IC.call+' Call Rameen</a><a class="btn btn-wa" target="_blank" rel="noopener" href="'+waLink(WA,'Hello, I am interested in: '+l.title+' ('+l.location+') – seen on Rameen Property Trust portal.')+'">'+IC.wa+' WhatsApp</a></div>'+
   '<p class="hint" style="text-align:center;margin-top:10px">All enquiries are handled by Rameen Property Trust.</p></div>';
  $('#modal').dataset.id=id;
  $('#overlay').classList.add('show');
  if(!noView&&$('#grid'))grid();
}
function closeM(){$('#overlay').classList.remove('show')}
document.addEventListener('click',function(e){
  if(e.target.id==='overlay'){closeM();return}
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,id=t.dataset.id,l;
  function find(){return db.listings.filter(function(x){return x.id===id})[0]}
  if(a==='open')openL(id,!!t.dataset.noview);
  else if(a==='close')closeM();
  else if(a==='thumb'){var ls_=db.listings.filter(function(x){return x.id===$('#modal').dataset.id})[0];$('#mi').src=ls_.photos[+t.dataset.i];[].forEach.call(document.querySelectorAll('.thumbs img'),function(x){x.classList.remove('on')});t.classList.add('on')}
  else if(a==='rmphoto'){photos.splice(+t.dataset.i,1);prev()}
  else if(a==='logout'){db.meId=null;db.meObj=null;del(K.m);del(K.mo);go('/broker-register')}
  else if(a==='adminout'){del(K.a);setPw('');pAdmin()}
  else if(a==='approve'){adminAct('admin_set_status',{p_id:id,p_status:'Approved'},function(){var x=find();if(x)x.status='Approved'})}
  else if(a==='reject'){adminAct('admin_set_status',{p_id:id,p_status:'Rejected'},function(){var x=find();if(x)x.status='Rejected'})}
  else if(a==='delete'){if(confirm('Delete this listing permanently?')){adminAct('admin_delete',{p_id:id},function(){db.listings=db.listings.filter(function(x){return x.id!==id})})}}
});
function adminAct(fn,args,localFn){
  if(REMOTE){args.p=adminPw;rpc(fn,args).then(function(){render()}).catch(function(e){alert('Error: '+e.message)})}
  else{localFn();save();pAdmin()}
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM()});
document.getElementById('burger').addEventListener('click',function(){var m=document.getElementById('menu');var o=m.classList.toggle('open');this.setAttribute('aria-expanded',o)});
var routes={'/':pHome,'/listings':pListings,'/broker-register':pRegister,'/broker-dashboard':pDash,'/add-listing':pAdd,'/admin':pAdmin};
var rtoken=0;
function render(){
  var p=(location.hash.slice(1)||'/').split('?')[0];
  closeM();document.getElementById('menu').classList.remove('open');
  if(!REMOTE){db.brokers=ls(K.b,db.brokers);db.listings=ls(K.l,db.listings)}
  db.meId=ls(K.m,db.meId);
  [].forEach.call(document.querySelectorAll('#menu a'),function(a){a.classList.toggle('on',a.dataset.p===p)});
  var my=++rtoken;
  function show(failed){
    if(my!==rtoken)return;
    (routes[p]||pHome)();
    if(failed)app.insertAdjacentHTML('afterbegin','<div class="wrap"><p class="err" style="margin-top:12px">Could not load the latest data. Check your internet connection.</p></div>');
    if(!(p==='/broker-dashboard'&&!me())&&!(p==='/add-listing'&&!me()))window.scrollTo(0,0);
  }
  if(REMOTE&&(p==='/'||p==='/listings'||p==='/broker-dashboard'||p==='/admin')){
    if(p!=='/admin'||adminPw)app.innerHTML='<div class="wrap"><div class="empty" style="margin:40px 0">Loading…</div></div>';
    syncFor(p).then(function(){show(false)}).catch(function(){if(p==='/admin')setPw('');show(true)});
  }else show(false);
}
window.addEventListener('hashchange',render);
render();
})();
</script>
</body>
</html>
