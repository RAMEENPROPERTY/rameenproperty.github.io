<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rameen Property - Sambhajinagar</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f2f4f8}
.header{background:#0d2a54;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.btn{background:#ff6b00;color:#fff;padding:10px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
.card{background:#fff;margin:12px;padding:15px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:15px}
input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
#addForm{display:none}
.top-bar{padding:15px;display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="header">
<div><b>RAMEEN PROPERTY</b><br><small>Aurangabad / Sambhajinagar</small></div>
<button class="btn" onclick="brokerLogin()">Broker / Admin Login</button>
</div>

<div class="top-bar">
<button class="btn" onclick="showAddForm()">+ Add Listing</button>
<button class="btn" style="background:#555" onclick="logout()">Logout</button>
</div>

<div id="addForm" class="card">
<h3>Add New Property</h3>
<input id="title" placeholder="Title - ex: 4BHK Flat MGM Ke Paas">
<input id="location" placeholder="Location - ex: CIDCO N5 / Waluj">
<input id="price" placeholder="Price - ex: 75 Lakh / JV 50-50">
<select id="type"><option>Flat</option><option>Plot</option><option>JV Plot</option><option>Row House</option><option>Shop</option></select>
<textarea id="desc" placeholder="Description - ex: 1200 sqft, road touch"></textarea>
<button class="btn" onclick="saveProperty()">Save Property</button>
</div>

<div id="list" class="grid"></div>

<script>
let properties = JSON.parse(localStorage.getItem('rameen_properties') || '[]');
let isBroker = localStorage.getItem('isBroker') === 'true';
let isAdmin = localStorage.getItem('isAdmin') === 'true';

function brokerLogin(){
 let pass = prompt("Password daalo:");
 if(pass === "admin123"){
   localStorage.setItem('isAdmin','true');
   localStorage.setItem('isBroker','true');
   isAdmin=true; isBroker=true;
   alert("ADMIN LOGIN SUCCESS BOSS! Aap Add + Delete dono kar sakte ho!");
   render();
 } else if(pass === "broker123"){
   localStorage.setItem('isBroker','true');
   isBroker=true;
   alert("BROKER LOGIN - Aap sirf Add kar sakte ho, Delete nahi!");
   render();
 } else { alert("Galat Password!"); }
}

function logout(){
 localStorage.removeItem('isBroker');
 localStorage.removeItem('isAdmin');
 isBroker=false; isAdmin=false;
 alert("Logout ho gaya!");
 render();
}

function showAddForm(){
 if(!isBroker && !isAdmin){ return alert("Pehle Broker/Admin Login karo BOSS!"); }
 document.getElementById('addForm').style.display='block';
}

function saveProperty(){
 if(!isBroker && !isAdmin) return alert("Pehle Login karo!");
 let p = {
  title: document.getElementById('title').value.trim(),
  location: document.getElementById('location').value.trim(),
  price: document.getElementById('price').value.trim(),
  type: document.getElementById('type').value,
  desc: document.getElementById('desc').value.trim()
 };
 if(!p.title){ return alert("Title bharo BOSS!"); }
 properties.push(p);
 localStorage.setItem('rameen_properties', JSON.stringify(properties));
 document.getElementById('title').value=""; document.getElementById('location').value=""; document.getElementById('price').value=""; document.getElementById('desc').value="";
 document.getElementById('addForm').style.display='none';
 render();
 alert("Property Add Ho Gayi!");
}

function render(){
 let html = "";
 properties.forEach((p,i)=>{
   let delBtn = isAdmin ? `<br><button onclick="deleteProp(${i})" style="background:red;color:white;border:none;padding:8px 12px;border-radius:5px;margin-top:10px;cursor:pointer">🗑️ DELETE (Only Admin)</button>` : "";
   html += `<div class="card"><h3>${p.title}</h3><p>📍 ${p.location} | <b>${p.type}</b></p><p>💰 <b>${p.price}</b></p><p>${p.desc}</p>${delBtn}</div>`;
 });
 if(properties.length===0) html = "<p style='padding:20px'>Koi property nahi hai BOSS! Broker Login karke + Add Listing dabao.</p>";
 document.getElementById('list').innerHTML = html;
}

function deleteProp(i){
 if(!isAdmin) return alert("Sirf ADMIN delete kar sakta hai BOSS!");
 if(confirm("ADMIN: Pakka DELETE karna hai?")){
   properties.splice(i,1);
   localStorage.setItem('rameen_properties', JSON.stringify(properties));
   render();
 }
}
render();
</script>
</body>
</html>
