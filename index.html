<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Property - Rameen</title>
<style>
body{font-family:Arial;background:#f0f2f5;padding:15px}
.box{background:white;padding:20px;border-radius:12px}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{background:#0d47a1;color:white;padding:14px;width:100%;border:none;border-radius:8px;font-size:16px;font-weight:bold}
.price-row{display:flex;gap:8px}
.price-row input{flex:2}
.price-row select{flex:1}
</style>
</head>
<body>
<div class="box">
<h2 style="color:#0d47a1;text-align:center">Add Property</h2>
<select id="for"><option>FOR SALE</option><option>FOR RENT</option></select>
<select id="type">
<option>HOUSE</option><option>FLAT</option><option>PLOT</option><option>COMMERCIAL PLOT</option><option>SHOP</option>
</select>
<input id="title" placeholder="Title Ex: Highway Touch Plot">
<div class="price-row">
<input id="priceNum" type="number" placeholder="Price Ex: 15">
<select id="priceUnit"><option>Lakh</option><option>Cr</option><option>Thousand</option></select>
</div>
<input id="area" placeholder="Area Ex: 1000 sqft">
<input id="location" placeholder="Location Ex: Nanded">
<input id="contact" placeholder="Contact Number">
<button onclick="save()">SAVE PROPERTY</button>
<a href="index.html" style="display:block;text-align:center;margin-top:15px;color:#0d47a1">← Back to Home</a>
</div>

<script>
function save(){
 var num=document.getElementById('priceNum').value;
 var unit=document.getElementById('priceUnit').value;
 if(!num){alert('Price likho!');return;}
 var finalPrice=num+' '+unit;
 var prop={
  title:document.getElementById('title').value||'New Property',
  for:document.getElementById('for').value,
  type:document.getElementById('type').value,
  price:finalPrice,
  area:document.getElementById('area').value||'Nanded',
  location:document.getElementById('location').value||'Nanded',
  date:new Date().toLocaleDateString(),
  contact:document.getElementById('contact').value||'9545247374'
 };
 var all=JSON.parse(localStorage.getItem('rameen_props')||'[]');
 all.push(prop);
 localStorage.setItem('rameen_props',JSON.stringify(all));
 alert(prop.type+' - ₹ '+finalPrice+' SAVE HO GAYA!');
 window.location.href='index.html';
}
</script>
</body>
</html>
