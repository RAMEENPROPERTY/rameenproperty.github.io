
<section id="rp-online">
  <h2>RAMEEN PROPERTY — Admin</h2>

  <div id="rp-login">
    <input id="rp-email" type="email"
      placeholder="Admin email" autocomplete="username">
    <input id="rp-password" type="password"
      placeholder="Admin password" autocomplete="current-password">
    <button id="rp-login-btn">Admin Login</button>
  </div>

  <div id="rp-admin" hidden>
    <h3>Add Property</h3>
    <input id="rp-title" placeholder="Property title">
    <select id="rp-type">
      <option>Plot</option>
      <option>Flat</option>
      <option>JV</option>
      <option>Commercial</option>
    </select>
    <input id="rp-location" placeholder="Location">
    <input id="rp-price" placeholder="Price / budget">
    <textarea id="rp-details" placeholder="Property details"></textarea>
    <button id="rp-add">Publish Listing</button>
    <button id="rp-logout">Logout</button>
  </div>

  <p id="rp-status" aria-live="polite"></p>
  <h3>Online Property Listings</h3>
  <div id="rp-listings"></div>
</section>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs,
  query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

// Firebase Console se apni web app ki config yahan daalein.
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};

const status = document.getElementById("rp-status");
const login = document.getElementById("rp-login");
const admin = document.getElementById("rp-admin");
const listingBox = document.getElementById("rp-listings");

if (firebaseConfig.apiKey.startsWith("YOUR_")) {
  status.textContent =
    "Setup pending: Firebase web app configuration add karein.";
} else {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  document.getElementById("rp-login-btn").onclick = async () => {
    try {
      await signInWithEmailAndPassword(
        auth,
        document.getElementById("rp-email").value.trim(),
        document.getElementById("rp-password").value
      );
      status.textContent = "Login request successful.";
    } catch {
      status.textContent = "Login failed. Email/password check karein.";
    }
  };

  document.getElementById("rp-logout").onclick =
    () => signOut(auth);

  onAuthStateChanged(auth, async user => {
    login.hidden = !!user;
    admin.hidden = !user;
    await loadListings();
  });

  async function loadListings() {
    listingBox.replaceChildren();
    try {
      const q = query(
        collection(db, "properties"),
        orderBy("createdAt", "desc")
      );
      const snapshot = await getDocs(q);

      snapshot.forEach(docSnap => {
        const p = docSnap.data();
        const card = document.createElement("article");
        const title = document.createElement("h3");
        title.textContent = p.title || "Property";
        const info = document.createElement("p");
        info.textContent = [
          p.type, p.location, p.price, p.details
        ].filter(Boolean).join(" • ");
        const wa = document.createElement("a");
        wa.href = "https://wa.me/919545247374?text=" +
          encodeURIComponent("Interested in " + (p.title || "property"));
        wa.textContent = "WhatsApp Enquiry";
        wa.target = "_blank";
        wa.rel = "noopener noreferrer";
        card.append(title, info, wa);
        listingBox.appendChild(card);
      });
    } catch {
      status.textContent =
        "Listings load nahi hui. Firebase database rules check karein.";
    }
  }

  document.getElementById("rp-add").onclick = async () => {
    if (!auth.currentUser) return;
    const title = document.getElementById("rp-title").value.trim();
    const location = document.getElementById("rp-location").value.trim();

    if (!title || !location) {
      status.textContent = "Title aur location zaroori hain.";
      return;
    }

    try {
      await addDoc(collection(db, "properties"), {
        title,
        location,
        type: document.getElementById("rp-type").value,
        price: document.getElementById("rp-price").value.trim(),
        details: document.getElementById("rp-details").value.trim(),
        createdAt: serverTimestamp()
      });
      status.textContent = "Property online save ho gayi.";
      document.getElementById("rp-title").value = "";
      document.getElementById("rp-location").value = "";
      document.getElementById("rp-price").value = "";
      document.getElementById("rp-details").value = "";
      await loadListings();
    } catch {
      status.textContent =
        "Save nahi hua. Firebase authentication aur security rules check karein.";
    }
  };
}
</script.>
