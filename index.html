
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAMEEN PROPERTY TRUST - SECURE PRIME</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}</style>
</head>
<body class="bg-[#f5f5f0] font-sans select-none">
<header class="bg-[#0a192f] text-white p-3 sticky top-0 z-50 flex justify-between items-center">
<div id="logoTrigger" class="cursor-pointer"><div class="font-black text-lg leading-none">RAMEEN</div><div class="text-[10px] text-[#c9a86a] tracking-widest">PROPERTY TRUST</div></div>
<div class="flex gap-2"><button onclick="openAdd()" class="bg-[#c9a86a] text-black px-4 py-2 rounded-full text-xs font-bold">+ ADD</button><button id="adminBtn" class="hidden bg-red-600 px-4 py-2 rounded-full text-xs font-bold">ADMIN</button></div>
</header>
<div class="bg-white p-2 flex gap-2 overflow-x-auto sticky top-[52px] z-40 shadow-sm no-scrollbar">
<button onclick="filter('ALL')" id="btn-ALL" class="px-4 py-2 bg-[#0a192f] text-white rounded-full text-xs whitespace-nowrap">All</button>
<button onclick="filter('FLAT')" id="btn-FLAT" class="px-4 py-2 bg-gray-100 rounded-full text-xs whitespace-nowrap">Flat</button>
<button onclick="filter('ROW HOUSE')" id="btn-ROW HOUSE" class="px-4 py-2 bg-gray-100 rounded-full text-xs whitespace-nowrap">Row House</button>
<button onclick="filter('BANGLO')" id="btn-BANGLO" class="px-4 py-2 bg-gray-100 rounded-full text-xs whitespace-nowrap">Banglo</button>
<button onclick="filter('PLOT')" id="btn-PLOT" class="px-4 py-2 bg-gray-100 rounded-full text-xs whitespace-nowrap">Plot</button>
<button onclick="filter('COMM. PLOT')" id="btn-COMM. PLOT" class="px-4 py-2 bg-gray-100 rounded-full text-xs whitespace-nowrap">Comm. Plot</button>
<button onclick="filter('RENTAL')" id="btn-RENTAL" class="px-4 py-2 bg-gray-100 rounded-full text-xs whitespace-nowrap">Rental</button>
<button onclick="filter('LODGING')" id="btn-LODGING" class="px-4 py-2 bg-gray-100 rounded-full text-xs whitespace-nowrap">Lodging</button>
</div>
<div id="list" class="p-3 grid grid-cols-1 md:grid-cols-3 gap-3"></div>
<div id="modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-3">
<div class="bg-white rounded-2xl w-full max-w-md p-4 max-h-[90vh] overflow-y-auto">
<h2 class="font-bold mb-3">Add Property - Secure Prime</h2>
<input id="title" placeholder="Title" class="w-full border p-2.5 rounded-xl mb-2 text-sm">
<select id="type" class="w-full border p-2.5 rounded-xl mb-2 text-sm"><option>FLAT</option><option>ROW HOUSE</option><option>BANGLO</option><option>PLOT</option><option>COMM. PLOT</option><option>RENTAL</option><option>LODGING</option><option>R ZONE</option><option>R+C</option></select>
<div class="flex gap-2 mb-2"><input id="price" placeholder="Price" class="flex-1 border p-2.5 rounded-xl text-sm"><select id="priceUnit" class="border p-2.5 rounded-xl text-sm"><option>per sqft</option><option>Lakh</option><option>Cr</option></select></div>
<div class="flex gap-2 mb-2"><input id="area" placeholder="Area" class="flex-1 border p-2.5 rounded-xl text-sm"><select id="areaUnit" class="border p-2.5 rounded-xl text-sm"><option>Sqft</option><option>Guntha</option><option>Acre</option></select></div>
<input id="diposit" placeholder="Deposit" class="w-full border p-2.5 rounded-xl mb-2 text-sm">
<input id="loc" placeholder="Location" class="w-full border p-2.5 rounded-xl mb-2 text-sm">
<input id="img" placeholder="Image Link" class="w-full border p-2.5 rounded-xl mb-2 text-sm">
<input id="bname" placeholder="Broker Name" class="w-full border p-2.5 rounded-xl mb-2 text-sm">
<input id="bphone" placeholder="Broker Phone" class="w-full border p-2.5 rounded-xl mb-3 text-sm">
<div class="flex gap-2"><button onclick="closeM()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold text-sm">Cancel</button><button onclick="save()" class="flex-1 bg-[#0a192f] text-white py-3 rounded-xl font-bold text-sm">SAVE</button></div>
</div>
</div>
