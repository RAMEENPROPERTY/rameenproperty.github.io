<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rameen Property</title>
<style>
body{margin:0;font-family:sans-serif;background:#f1f3f6}
.h{background:#0f2a44;color:#fff;padding:15px;text-align:center}
.h b{color:#e8b631;font-size:22px}
.box{max-width:1100px;margin:15px auto;background:#fff;padding:12px;border-radius:12px}
select,input,button{padding:12px;width:100%;margin:5px 0;border-radius:8px;border:1px solid #ccc}
.btn{background:#0f2a44;color:#fff;font-weight:700}
.list{display:grid;gap:12px;max-width:1100px;margin:auto;padding:12px}
@media(min-width:700px){.list{grid-template-columns:1fr 1fr}}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #ddd}
.card img{width:100%;height:160px;object-fit:cover}
.card div{padding:10px}
.price{color:green;font-weight:700}
.wa{background:#128c4f;color:#fff;display:block;text-align:center;padding:8px;border-radius:8px;text-decoration:none;margin-top:6px}
.float{position:fixed;right:12px;bottom:12px;background:#128c4f;color:#fff;padding:12px 18px;border-radius:30px;text-decoration:none;font-weight:700}
</style></head><body>
<div class="h"><b>RAMEEN PROPERTY</b><br>औरंगाबाद में सभी प्रॉपर्टी</div>
<div class="box">
<select id="fType"><option value="">सभी प्रकार</option><option>Plot</option><option>Flat</option><option>JV</option><option>Villa</option><option>Shop</option><option>Office</option></select>
<input id="fSearch" placeholder="खोजें - CIDCO, Beed Bypass">
<button class="btn" onclick="doSearch()">खोजें</button>
</div>
<div class="list" id="list"></div>
<a class="float" href="https://wa.me/919545247374">WhatsApp</a>
<script>
let props=[
{type:"JV",img:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600",title:"CIDCO N-5 JV प्लॉट",city:"CIDCO N-5",price:"संपर्क करें"},
{type:"Plot",img:"https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6?w=600",title:"Beed Bypass प्लॉट",city:"Beed Bypass",price:"₹45 लाख"},
{type:"Flat",img:"https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=600",title:"2 BHK फ्लैट - CIDCO",city:"CIDCO",price:"₹32 लाख"},
{type:"Villa",img:"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=600",title:"बंगला - CIDCO",city:"CIDCO",price:"₹85 लाख"},
{type:"Shop",img:"https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600",title:"दुकान - CIDCO",city:"CIDCO",price:"₹22 लाख"},
{type:"Office",img:"https://images.unsplash.com/photo-1497366216548-37526070297c?w=600",title:"ऑफिस - प्रोझोन",city:"API",price:"₹35k/महीना"}
];
function render(list){
document.getElementById("list").innerHTML=list.map(p=>`<div class="card"><img src="${p.img}"><div><b>${p.title}</b><br>📍 ${p.city}<br><span class="price">${p.price}</span><br><span style="font-size:12px">${p.type}</span><a class="wa" href="https://wa.me/919545247374?text=${p.title}">WhatsApp</a></div></div>`).join("");
}
function doSearch(){
let q=document.getElementById("fSearch").value.toLowerCase();
let ty=document.getElementById("fType").value;
let f=props.filter(p=>(!ty||p.type==ty)&&(p.title+p.city).toLowerCase().includes(q));
render(f);
}
render(props);
</script></body></html>
