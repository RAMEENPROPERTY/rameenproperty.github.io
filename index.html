<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAMEEN PROPERTY</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f4f7;color:#222}
header{background:#102b46;color:white;padding:22px 15px;text-align:center}
header h1{margin:0;color:#f5c542}
header p{margin-bottom:0}
.container{padding:15px;max-width:800px;margin:auto}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,select,textarea,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#102b46;color:white;border:0;font-weight:bold}
.whatsapp{background:#168b50;color:white;text-align:center;padding:12px;display:block;border-radius:7px;text-decoration:none}
.price{color:#13733a;font-weight:bold}
.small{font-size:13px;color:#666}
</style>
</head>

<body>
<header>
<h1>RAMEEN PROPERTY</h1>
<p>Buy • Sell • Plots • Flats • Joint Venture</p>
</header>

<div class="container">
<div class="card">
<h2>Find Properties</h2>
<input id="search" placeholder="Search city, area or property..."
oninput="showListings()">
<select id="filter" onchange="showListings()">
<option value="">All Properties</option>
<option>Plot</option>
<option>Flat</option>
<option>JV</option>
<option>Commercial</option>
</select>
</div>

<div id="listings"></div>

<div class="card">
<h2>Submit Property</h2>
<p class="small">Property details submit karne ke liye form bharein.</p>
<input id="title" placeholder="Property title" required>
<select id="type">
<option>Plot</option><option>Flat</option>
<option>JV</option><option>Commercial</option>
</select>
<input id="city" placeholder="City / Location">
<input id="price" placeholder="Expected price (e.g. ₹5 crore)">
<textarea id="details" placeholder="Area, road width, JV terms, details"></textarea>
<input id="owner" placeholder="Owner / broker contact number">
<button onclick="submitProperty()">Submit Listing</button>
<p id="status"></p>
</div>

<div class="card">
<h3>Contact RAMEEN PROPERTY</h3>
<a class="whatsapp"
href="https://wa.me/919545247374?text=Hello%20RAMEEN%20PROPERTY"
target="_blank">Chat on WhatsApp</a>
</div>
</div>

<script>
const properties = [
{
title:"CIDCO N-5 JV Plot",
type:"JV",
city:"Aurangabad",
price:"Contact for price",
details:"Residential JV opportunity. Proposed 3 BHK apartment project. All development details subject to verification."
}
];

function showListings(){
const q=document.getElementById("search").value.toLowerCase();
const f=document.getElementById("filter").value;
const box=document.getElementById("listings");

const found=properties.filter(p=>
(p.title+" "+p.city+" "+p.details).toLowerCase().includes(q)
&&(!f||p.type===f));

box.innerHTML=found.length?"":"<div class='card'>No properties found.</div>";

found.forEach(p=>{
box.innerHTML+=`
<div class="card">
<h3>${escapeHTML(p.title)}</h3>
<p>${escapeHTML(p.type)} • ${escapeHTML(p.city)}</p>
<p class="price">${escapeHTML(p.price)}</p>
<p>${escapeHTML(p.details)}</p>
<a class="whatsapp"
href="https://wa.me/919545247374?text=${encodeURIComponent("I am interested in "+p.title)}"
target="_blank">Enquire on WhatsApp</a>
</div>`;
});
}

function escapeHTML(s){
return String(s||"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function submitProperty(){
const title=document.getElementById("title").value.trim();
const city=document.getElementById("city").value.trim();
const owner=document.getElementById("owner").value.trim();

if(!title||!city){
document.getElementById("status").textContent=
"Property title aur location bharein.";
return;
}

const message=
"New Property Listing\n"+
"Title: "+title+"\n"+
"Type: "+document.getElementById("type").value+"\n"+
"Location: "+city+"\n"+
"Price: "+document.getElementById("price").value+"\n"+
"Details: "+document.getElementById("details").value+
"\nContact: "+owner;

location.href="https://wa.me/919545247374?text="+encodeURIComponent(message);
}

showListings();
</script>
</body>
</html>
