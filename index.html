<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAMEEN PROPERTY - PRIME</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>.hidden{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#eef3ff] pb-28">
<header class="bg-white p-3 flex justify-between items-center shadow sticky top-0 z-50">
<h1 id="secretAdminTrigger" class="font-black leading-none select-none" style="cursor:pointer;"><span class="text-blue-900 text-xl">RAMEEN</span> <span class="text-yellow-500">PROPERTY</span><br><span class="text-[8px] text-yellow-600 tracking-[3px]">ADORE • AURANGABAD • PRIME</span></h1>
<div class="flex gap-4 text-blue-900 text-lg"><i class="fa fa-search"></i></div>
</header>

<div class="m-3 bg-gradient-to-br from-blue-200 to-yellow-200 rounded-[22px] p-5 text-center">
<h2 class="text-[26px] font-black text-blue-900 leading-none">Find Your Perfect Property</h2>
<input id="searchBox" placeholder="Search location..." class="w-full mt-4 p-3 rounded-full border-2 border-blue-900 text-sm font-bold">
</div>

<div class="px-3 flex gap-2 overflow-auto mt-3">
<button onclick="filterCat('all')" class="bg-yellow-400 px-5 py-3 rounded-2xl font-black text-xs">All</button>
<button onclick="filterCat('flat')" class="bg-white border-2 border-blue-900 px-5 py-3 rounded-2xl font-black text-xs">Flat</button>
<button onclick="filterCat('plot')" class="bg-white border-2 border-blue-900 px-5 py-3 rounded-2xl font-black text-xs">Plot</button>
<button onclick="filterCat('rowhouse')" class="bg-white border-2 border-blue-900 px-5 py-3 rounded-2xl font-black text-xs">Row House</button>
<button onclick="filterCat('rent')" class="bg-white border-2 border-black px-5 py-3 rounded-2xl font-black text-xs">Rent</button>
</div>

<div id="listingGrid" class="grid grid-cols-2 gap-3 p-3">
<p class="col-span-2 text-center py-10 font-black">Loading... 🔄</p>
</div>

<button onclick="openAdd()" style="position:fixed;bottom:100px;right:18px;background:#facc15;width:60px;height:60px;border-radius:50%;font-size:30px;font-weight:900;box-shadow:0 5px 15px black;z-index:900;">+</button>

<div id="addModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;padding:20px;"><div style="background:white;border-radius:20px;padding:18px;max-width:380px;margin:40px auto;"><h2 class="font-black text-blue-900">Add Property</h2><select id="pType" class="w-full mt-2 p-2.5 border-2 border-blue-900 rounded-xl font-bold text-sm"><option>Flat</option><option>Row House</option><option>Plot</option><option>R+C Plot</option><option>Commercial Plot</option></select><select id="pFor" class="w-full mt-2 p-2.5 border-2 border-yellow-400 rounded-xl font-black text-sm"><option value="sale">For Sale</option><option value="rent">For Rent</option></select><input id="pTitle" placeholder="Title" class="w-full mt-2 p-2.5 border-2 border-blue-900 rounded-xl text-sm"><input id="pPrice" placeholder="Price e.g. ₹45.5L" class="w-full mt-2 p-2.5 border-2 border-blue-900 rounded-xl text-sm"><input id="pSqft" placeholder="Sqft e.g. 950" class="w-full mt-2 p-2.5 border-2 border-blue-900 rounded-xl text-sm"><input id="pLoc" placeholder="Location" class="w-full mt-2 p-2.5 border-2 border-blue-900 rounded-xl text-sm"><input id="pPhone" placeholder="Your Phone (Only Admin will see)" class="w-full mt-2 p-2.5 border-2 border-red-500 rounded-xl text-sm" value="9545247374"><input id="pPhoto" type="file" accept="image/*" class="w-full mt-2 p-2.5 border-2 border-blue-900 rounded-xl text-sm"><button onclick="addProperty()" id="addBtn" class="w-full bg-yellow-400 mt-3 p-3 rounded-full font-black">ADD LISTING 🚀</button><button onclick="closeAdd()" class="w-full bg-white border-2 border-black mt-2 p-2 rounded-full font-black">Cancel</button></div></div>

<script>
// ===== FIREBASE CONFIG - YAHAN APNA CONFIG DALNA HAI =====
const firebaseConfig = {
  apiKey: "REPLACE_WITH_YOURS",
  authDomain: "rameen-property.firebaseapp.com",
  projectId: "rameen-property",
  storageBucket: "rameen-property.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
// =========================================================
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let isAdmin = localStorage.getItem('rameen_admin') === 'true';
let tapCount = 0;
let tapTimer = null;

document.getElementById('secretAdminTrigger').addEventListener('click', ()=>{
  tapCount++;
  if(tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>{ tapCount=0; }, 2000);
  if(tapCount >= 5){
    tapCount=0;
    adminLogin();
  }
});

function adminLogin(){
  let p=prompt("Admin Password: rameen123");
  if(p==="rameen123"){
    isAdmin=true;
    localStorage.setItem('rameen_admin','true');
    document.querySelectorAll('.admin-contact').forEach(e=>e.classList.remove('hidden'));
    document.querySelectorAll('.public-contact').forEach(e=>e.classList.add('hidden'));
    alert("Admin ON Boss! ✅");
  }else if(p!==null){ alert("Wrong Password!"); }
}

function openAdd(){document.getElementById('addModal').classList.remove('hidden')}
function closeAdd(){document.getElementById('addModal').classList.add('hidden')}

db.collection("properties").orderBy("createdAt","desc").onSnapshot((snapshot)=>{
  const grid = document.getElementById('listingGrid');
  grid.innerHTML = "";
  if(snapshot.empty){
    grid.innerHTML = `<p class="col-span-2 text-center py-10 font-bold text-gray-500">Koi listing nahi. + se dalo Boss!</p>`;
    return;
  }
  snapshot.forEach(doc=>{
    const data = doc.data();
    const id = doc.id;
    let html = `<div data-type="${data.dtype}" class="prop-card bg-white rounded-2xl p-2 shadow">
      <span class="${data.badgeColor} text-[9px] font-black px-2 py-1 rounded">${data.badge}</span>
      <img src="${data.image}" class="rounded-xl h-24 w-full object-cover mt-1">
      <p class="font-black text-[12px] mt-1">${data.title}</p>
      <p class="text-[10px] text-gray-500">${data.loc}${data.sqft?' | '+data.sqft+' Sqft':''}</p>
      <p class="font-black text-blue-900 text-sm">${data.price}</p>
      <div class="public-contact ${isAdmin?'hidden':''}"><a href="https://wa.me/919545247374?text=Hi, ${data.title} chahiye" target="_blank" class="block bg-yellow-400 text-center py-1.5 rounded-full text-[11px] font-black mt-2">Contact Admin</a></div>
      <div class="admin-contact ${isAdmin?'':'hidden'}"><a href="tel:${data.phone}" class="block bg-green-600 text-white text-center py-1 rounded-full text-[11px] font-black mt-2">📞 ${data.phone} (ADMIN ONLY)</a><button onclick="deleteCard('${id}')" class="w-full bg-red-600 text-white py-1 rounded-full text-[10px] font-black mt-1">🗑️ DELETE</button></div>
    </div>`;
    grid.insertAdjacentHTML('beforeend', html);
  });
});

function addProperty(){
  let type=document.getElementById('pType').value.toLowerCase().replace(/[^a-z]/g,'');
  let map={flat:'flat',rowhouse:'rowhouse',plot:'plot',rcplot:'rc',commercialplot:'commercial'};
  let dtype=map[type]||'plot';
  let pFor=document.getElementById('pFor').value;
  let badge=pFor==='rent'?'FOR RENT':(dtype==='flat'?'FEATURED':'LIVE');
  let badgeColor=pFor==='rent'?'bg-black text-white':(dtype==='flat'?'bg-yellow-400':'bg-green-500 text-white');
  if(pFor==='rent')dtype='rent';
  let title=document.getElementById('pTitle').value||'New Property';
  let price=document.getElementById('pPrice').value||'₹0';
  let sqft = (document.getElementById('pSqft').value||'').replace(/sqft/i,'').trim();
  let loc=document.getElementById('pLoc').value||'Aurangabad';
  let phone=document.getElementById('pPhone').value||'9545247374';
  let file=document.getElementById('pPhoto').files[0];
  document.getElementById('addBtn').innerText = "Uploading... ⏳";
  function saveToFirebase(imgSrc){
    db.collection("properties").add({
      title, price, sqft, loc, phone, image: imgSrc,
      dtype, badge, badgeColor,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>{
      document.getElementById('addBtn').innerText = "ADD LISTING 🚀";
      closeAdd();
      alert("Add ho gaya Boss! ✅");
    });
  }
  if(file){let r=new FileReader();r.onload=e=>saveToFirebase(e.target.result);r.readAsDataURL(file)}else{saveToFirebase('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=400')}
}
function deleteCard(docId){if(confirm("DELETE? Sabke phone se hatega!")){db.collection("properties").doc(docId).delete();}}
function filterCat(t){document.querySelectorAll('.prop-card').forEach(c=>{c.style.display=(t==='all'||c.dataset.type===t)?'block':'none'})}
document.getElementById('searchBox').addEventListener('input',function(){let v=this.value.toLowerCase();document.querySelectorAll('.prop-card').forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(v)?'block':'none'})});
</script>
</body>
</html>
