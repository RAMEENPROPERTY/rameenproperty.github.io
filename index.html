<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Property - RAMEEN</title>
<style>
body{font-family:Arial;margin:0;background:#f2f6fb;padding:15px}
.box{background:white;padding:20px;border-radius:12px;max-width:400px;margin:auto;box-shadow:0 2px 10px #ccc}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{background:#1565c0;color:white;padding:12px;border:none;border-radius:8px;width:100%;font-weight:bold;font-size:16px;cursor:pointer}
h2{color:#0d47a1;text-align:center}
label{font-weight:bold;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h2>Add Your Property</h2>
<p style="text-align:center;font-size:13px">Rameen Property - Owner: Shaikh Akil</p>

<label>Property For</label>
<select id="for">
<option>FOR SALE</option>
<option>FOR RENT</option>
</select>

<label>Property Type</label>
<select id="type" onchange="checkType()">
<option value="FLAT">FLAT</option>
<option value="PLOT">PLOT</option>
<option value="COMMERCIAL SHOP">COMMERCIAL SHOP</option>
<option value="COMMERCIAL OFFICE">COMMERCIAL OFFICE</option>
<option value="COMMERCIAL PLOT">COMMERCIAL PLOT</option>
</select>

<label>Title (ex: 2BHK Flat)</label>
<input id="title" placeholder="Ex: 2BHK Flat for Sale">

<label>Price</label>
<input id="price" placeholder="Ex: 38 Lakh / 15000 per month">

<label>Area (sq.ft)</label>
<input id="area" placeholder="Ex: 950 sq.ft">

<label>Location</label>
<input id="loc" placeholder="Ex: CIDCO, Nanded">

<label>Your Name & Number</label>
<input id="contact" placeholder="Ex: Akil - 9545247374">

<button onclick="send()">Submit Property on WhatsApp</button>
<br><br>
<a href="index.html" style="text-align:center;display:block">← Back to Home</a>
</div>

<script>
function checkType(){
 // Commercial Plot option will now work 100%
 alert("You selected: " + document.getElementById('type').value);
}
function send(){
 let msg = "NEW PROPERTY FOR RAMEEN WEBSITE:%0A%0AType: " + document.getElementById('type').value + "%0AFor: " + document.getElementById('for').value + "%0ATitle: " + document.getElementById('title').value + "%0APrice: " + document.getElementById('price').value + "%0AArea: " + document.getElementById('area').value + "%0ALocation: " + document.getElementById('loc').value + "%0AContact: " + document.getElementById('contact').value;
 window.open("https://wa.me/919545247374?text=" + msg, "_blank");
}
</script>
</body>
</html>
