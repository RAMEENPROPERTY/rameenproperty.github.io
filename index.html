<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rameen Property Trust - Nanded</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-[#f5f7fb]">
<header class="bg-[#0a192f] text-white p-4 sticky top-0 z-50">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<div><div class="font-bold">RAMEEN</div><div class="text-[9px] text-[#c9a86a]">PROPERTY TRUST</div></div>
<div class="flex gap-2">
<button onclick="openAdd()" class="bg-[#c9a86a] text-black px-3 py-2 rounded-full text-[11px] font-bold">+ ADD</button>
<button onclick="adminLogin()" id="adminBtn" class="bg-white/20 px-3 py-2 rounded-full text-[11px]">ADMIN</button>
</div>
</div>
</header>

<div class="max-w-6xl mx-auto p-3">
<div class="bg-white p-3 rounded-2xl shadow-sm flex gap-2 overflow-x-auto">
<button onclick="filter('ALL')" class="bg-[#0a192f] text-white px-3 py-2 rounded-full text-[11px]">All</button>
<button onclick="filter('FLAT')" class="bg-gray-100 px-3 py-2 rounded-full text-[11px]">Flat</button>
<button onclick="filter('ROW HOUSE')" class="bg-gray-100 px-3 py-2 rounded-full text-[11px]">Row House</button>
<button onclick="filter('BANGLO')" class="bg-gray-100 px-3 py-2 rounded-full text-[11px]">Banglo</button>
<button onclick="filter('PLOT')" class="bg-gray-100 px-3 py-2 rounded-full text-[11px]">Plot</button>
<button onclick="filter('COMMERCIAL PLOT')" class="bg-gray-100 px-3 py-2 rounded-full text-[11px]">Comm. Plot</button>
<button onclick="filter('R ZONE PLOT')" class="bg-gray-100 px-3 py-2 rounded-full text-[11px]">R Zone</button>
<button onclick="filter('R+C PLOT')" class="bg-gray-100 px-3 py-2 rounded-full text-[11px]">R+C</button>
</div>
<div id="list" class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3"></div>
</div>

<div id="modal" class="hidden fixed inset-0 bg-black/70 z-[100] flex items-center justify-center p-3">
<div class="bg-white w-full max-w-md p-5 rounded-[20px] max-h-[95vh] overflow-y-auto">
<h2 class="font-bold text-lg">Add Property - All Options</h2>
<select id="type" class="w-full p-3 border rounded-xl mb-2 text-sm font-bold bg-blue-50 mt-3">
<option>FLAT</option>
<option>ROW HOUSE</option>
<option>BANGLO</option>
<option>PLOT</option>
<option>COMMERCIAL PLOT</option>
<option>R ZONE PLOT</option>
<option>R+C PLOT</option>
<option>SHOP</option>
<option>HOUSE</option>
</select>
<input id="title" placeholder="Title: Ex: 3BHK Banglo" class="w-full p-3 border rounded-xl mb-2 text-sm">
<div class="grid grid-cols-2 gap-2 mb-2">
<input id="price" placeholder="Price: 45" type="number" class="p-3 border rounded-xl text-sm">
<select id="priceUnit" class="p-3 border rounded-xl text-sm font-bold"><option>Lakh</option><option>Cr</option><option>Thousand</option><option>Per Sqft</option></select>
</div>
<div class="grid grid-cols-2 gap-2 mb-2">
<input id="area" placeholder="Sqft: 2500" class="p-3 border rounded-xl text-sm">
<select id="areaUnit" class="p-3 border rounded-xl text-sm"><option>Sqft</option><option>Guntha</option><option>Acre</option></select>
</div>
<input id="loc" placeholder="Location: Nanded" class="w-full p-3 border rounded-xl mb-2 text-sm">
<input id="img" placeholder="Photo Link https://..." class="w-full p-3 border rounded-xl mb-2 text-sm">
<input id="bname" placeholder="Your Name" class="w-full p-3 border rounded-xl mb-2 text-sm">
<input id="bphone" placeholder="Your Phone (Secret)" class="w-full p-3 border rounded-xl mb-3 text-sm bg-yellow-50">
<button onclick="save()" class="w-full bg-[#0a192f] text-white py-3 rounded-xl font-bold text-sm">SAVE PROPERTY</button>
<button onclick="closeM()" class="w-full mt-2 py-2 text-gray-500 text-sm">Cancel</button>
</div>
</div>

<a href="https://wa.me/919545247374" class="fixed bottom-6 right-6 bg-green-500 w-14 h-14 rounded-full flex items-center justify-center text-white font-bold shadow-xl">WA</a>

<script>
let isAdmin=false; let allData=JSON.parse(localStorage.getItem('rameen_v4_banglo')||'[]'); let curFilter='ALL';
if(allData.length===0){ allData=[{id:1,title:"3BHK Luxury Banglo",type:"BANGLO",price:"85 Lakh",area:"2500 Sqft",loc:"Nanded",img:"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9",bname:"Demo",bphone:"000"}]; localStorage.setItem('rameen_v4_banglo', JSON.stringify(allData)); }
function saveLS(){localStorage.setItem('rameen_v4_banglo', JSON.stringify(allData));}
function render(){
 let data=curFilter==='ALL'?allData:allData.filter(x=>x.type===curFilter);
 document.getElementById('list').innerHTML=data.map(p=>`<div class="bg-white rounded-2xl shadow-sm overflow-hidden border"><img src="${p.img||'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9'}" class="h-48 w-full object-cover"><div class="p-3"><div class="flex justify-between"><div class="font-bold text-[#0a192f]">₹ ${p.price}</div><span class="bg-[#c9a86a] text-black text-[9px] px-2 py-1 rounded-full font-bold">${p.type}</span></div><div class="font-semibold text-sm mt-1">${p.title}</div><div class="text-[11px] text-gray-500 mt-1">📍 ${p.loc} | 📐 ${p.area}</div><div class="flex gap-2 mt-3"><a href="tel:9545247374" class="flex-1 bg-[#0a192f] text-white text-center py-2.5 rounded-xl text-[11px] font-bold">CALL ADMIN</a><a href="https://wa.me/919545247374" class="flex-1 bg-green-500 text-white text-center py-2.5 rounded-xl text-[11px] font-bold">WHATSAPP</a></div>${isAdmin?`<div class="mt-2 bg-yellow-50 border p-2 rounded-xl text-[10px]">Broker: ${p.bname} - ${p.bphone}<br><button onclick="del(${p.id})" class="mt-1 w-full bg-red-500 text-white py-1.5 rounded-lg font-bold">DELETE</button></div>`:''}</div></div>`).reverse().join('')||'<p class="col-span-3 text-center py-20 text-gray-400">No property in '+curFilter+'</p>';
}
window.filter=(t)=>{curFilter=t; render();}
window.openAdd=()=>document.getElementById('modal').classList.remove('hidden');
window.closeM=()=>document.getElementById('modal').classList.add('hidden');
window.adminLogin=()=>{ if(isAdmin){isAdmin=false; adminBtn.innerText='ADMIN'; render(); return;} let pw=prompt('Password:'); if(pw==='Rameen@2024'){isAdmin=true; adminBtn.innerText='ADMIN ✓'; render();} else alert('Wrong');}
window.save=()=>{ if(!title.value||!price.value) return alert('Title Price likho'); const obj={id:Date.now(), title:title.value, type:type.value, price:price.value+' '+priceUnit.value, area:area.value+' '+areaUnit.value, loc:loc.value, img:img.value, bname:bname.value, bphone:bphone.value}; allData.push(obj); saveLS(); closeM(); render(); title.value=''; price.value=''; area.value=''; loc.value=''; img.value=''; alert('✅ Save Ho Gayi!');}
window.del=(id)=>{ if(confirm('Delete?')){ allData=allData.filter(x=>x.id!==id); saveLS(); render(); } }
render();
</script>
</body>
 </html>
