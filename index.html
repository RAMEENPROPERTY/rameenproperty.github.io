<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rameen Property - Nanded</title>
<style>
body{font-family:Arial;margin:0;background:#f0f2f5}
header{background:#0d47a1;color:white;padding:15px;text-align:center}
.filters{background:white;padding:10px;display:flex;gap:6px;overflow:auto;position:sticky;top:0}
.filters button{padding:8px 14px;border:1px solid #0d47a1;border-radius:20px;background:white}
.filters button.active{background:#0d47a1;color:white}
#list{padding:10px}
.card{background:white;padding:15px;margin:10px 0;border-radius:12px;box-shadow:0 1px 5px rgba(0,0,0,0.1)}
.price{color:green;font-weight:bold;font-size:18px}
.badge{background:#e3f2fd;color:#0d47a1;padding:3px 8px;border-radius:8px;font-size:12px;margin-right:5px}
</style>
</head>
<body>

<header>
<h2 style="margin:0">RAMEEN PROPERTY</h2>
<p style="margin:5px 0">Buy | Sell | Rent - Nanded</p>
<a href="add.html" style="background:white;color:#0d47a1;padding:8px 18px;border-radius:20px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:8px">+ Add Property</a>
</header>

<div class="filters">
<button class="active" onclick="showAll('ALL',this)">All</button>
<button onclick="showAll('HOUSE',this)">House</button>
<button onclick="showAll('FLAT',this)">Flat</button>
<button onclick="showAll('PLOT',this)">Plot</button>
<button onclick="showAll('COMMERCIAL PLOT',this)">Commercial Plot</button>
<button onclick="showAll('SHOP',this)">Shop</button>
</div>

<div id="list"></div>

<script>
function showAll(type,btn){
 if(btn){
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
 }
 var all=JSON.parse(localStorage.getItem('rameen_props')||'[]');
 var filtered=type==='ALL'?all:all.filter(p=>p.type===type);
 var list=document.getElementById('list');
 list.innerHTML='';
 if(filtered.length===0){
  list.innerHTML='<p style="text-align:center;margin-top:50px">Abhi koi property nahi hai<br><br><a href="add.html" style="background:#0d47a1;color:white;padding:10px 20px;border-radius:8px;text-decoration:none">+ Pehli Property Add Karo</a></p>';
  return;
 }
 filtered.forEach(p=>{
  var div=document.createElement('div');
  div.className='card';
  div.innerHTML='<h3 style="margin:0 0 5px;color:#0d47a1">'+p.title+'</h3><span class="badge">'+p.for+'</span><span class="badge">'+p.type+'</span><p class="price">₹ '+p.price+'</p><p>📍 '+p.location+' | 📐 '+p.area+'</p><p style="font-size:13px;color:#666">📅 '+p.date+' | 📞 '+p.contact+'</p>';
  list.appendChild(div);
 });
}
showAll('ALL');
</script>
</body>
</html>
