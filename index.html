<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rameen Property</title>
<style>
body{margin:0;font-family:sans-serif;background:#f1f3f6}
.h{background:#0f2a44;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}
.logo{color:#e8b631;font-weight:700}
.btn-add{background:#e8b631;color:#000;border:0;border-radius:20px;padding:7px 15px;font-weight:700}
.list{display:grid;gap:12px;max-width:1100px;margin:auto;padding:12px}
@media(min-width:700px){.list{grid-template-columns:1fr 1fr}}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #ddd}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:10px}
.price{color:#128c4f;font-weight:700}
.wa{background:#128c4f;color:#fff;display:block;text-align:center;padding:8px;border-radius:8px;text-decoration:none;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;padding:15px;z-index:99;overflow:auto}
.modal.open{display:grid}
.mbox{background:#fff;border-radius:12px;padding:16px;max-width:450px;width:100%}
.mbox input,.mbox select,.mbox textarea{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.btn-save{background:#0f2a44;color:#fff;border:0;padding:11px;width:100%;border-radius:8px;font-weight:700}
.btn-close{background:#eee;border:0;padding:9px;width:100%;border-radius:8px;margin-top:6px}
.preview{width:100%;height:150px;background:#eee;border-radius:8px;margin:6px 0;object-fit:cover;display:none}
.float-add{position:fixed;right:12px;bottom:60px;background:#e8b631;color:#000;padding:11px 16px;border-radius:30px;border:0;font-weight:700;z-index:10}
.float{position:fixed;right:12px;bottom:12px;background:#128c4f;color:#fff;padding:11px 16px;border-radius:30px;text-decoration:none;font-weight:700;z-index:10}
</style></head><body>
<div class="h"><div class="logo">RAMEEN PROPERTY</div><button class="btn-add" onclick="openAdd()">+ Add Photo</button></div>
<div style="background:#0f2a44;color:#fff;text-align:center;padding:12px"><h2 style="margin:0">औरंगाबाद में सभी प्रॉपर्टी</h2><div style="font-size:12px;opacity:.8">Photo wali listing - Direct WhatsApp</div></div>
<div class="list" id="list"></div>
<button class="float-add" onclick="openAdd()">+ Photo Listing</button>
<a class="float" href="https://wa.me/919545247374">WhatsApp</a>

<div class="modal" id="addModal"><div class="mbox">
<h3 style="margin:0 0 10px">📸 Photo ke saath Listing Jodo</h3>
<select id="aType"><option>Plot</option><option>Flat</option><option>JV</option><option>Villa</option><option>FarmHouse</option><option>Shop</option><option>Office</option><option>Commercial</option><option>BuilderFloor</option></select>
<input id="aTitle" placeholder="Title - ex: CIDCO Plot">
<input id="aCity" placeholder="Area - CIDCO, Beed Bypass">
<input id="aPrice" placeholder="Price - 45 Lakh">
<input id="aPhone" placeholder="Aapka Mobile Number - 98xxxxxxxx" type="tel">
<label style="font-size:12px;font-weight:700;margin-top:8px;display:block">📸 Phone se Photo Chuno:</label>
<input type="file" id="aFile" accept="image/*" onchange="previewFile()">
<img id="preview" class="preview">
<label style="font-size:11px;color:#666">Ya Photo ka Link (optional):</label>
<input id="aImg" placeholder="https://... photo link">
<textarea id="aDetails" placeholder="Details"></textarea>
<button class="btn-save" onclick="saveProp()">Save & WhatsApp pe Bhejo ✅</button>
<button class="btn-close" onclick="closeAdd()">Band Karo</button>
</div></div>

<script>
let selectedBase64="";
let props=JSON.parse(localStorage.getItem("rameenPropsV2")||"null")||[
{type:"Plot",img:"https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6?w=600",title:"Beed Bypass Plot",city:"Beed Bypass",price:"₹45 Lakh",details:"1000 sqft",phone:""},
{type:"Flat",img:"https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=600",title:"2 BHK Flat CIDCO",city:"CIDCO",price:"₹32 Lakh",details:"950 sqft",phone:""}
];
function saveLocal(){localStorage.setItem("rameenPropsV2",JSON.stringify(props));}
function render(list){
document.getElementById("list").innerHTML=list.map(p=>`<div class="card"><img src="${p.img}"><div class="card-body"><b>${p.title}</b><br>📍 ${p.city} | ${p.type}<br><span class="price">${p.price}</span><br><span style="font-size:12px">${p.details||""}</span>${p.phone?`<br><span style="font-size:12px">📞 ${p.phone}</span>`:""}<a class="wa" href="https://wa.me/919545247374?text=${encodeURIComponent(p.title+" - "+p.city)}">WhatsApp</a></div></div>`).join("");
}
function previewFile(){
let file=document.getElementById("aFile").files[0];
if(!file)return;
let reader=new FileReader();
reader.onload=function(e){
selectedBase64=e.target.result;
let img=document.getElementById("preview");
img.src=selectedBase64;
img.style.display="block";
};
reader.readAsDataURL(file);
}
function openAdd(){document.getElementById("addModal").classList.add("open")}
function closeAdd(){document.getElementById("addModal").classList.remove("open");selectedBase64="";document.getElementById("preview").style.display="none";}
function saveProp(){
let type=document.getElementById("aType").value;
let title=document.getElementById("aTitle").value||"New Property";
let city=document.getElementById("aCity").value||"Aurangabad";
let price=document.getElementById("aPrice").value||"Contact";
let phone=document.getElementById("aPhone").value||"";
let details=document.getElementById("aDetails").value||"";
let link=document.getElementById("aImg").value;
let finalImg="";
if(selectedBase64){finalImg=selectedBase64;}
else if(link){finalImg=link;}
else{let m={Plot:"https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6?w=600",Flat:"https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=600",JV:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600",Villa:"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=600",FarmHouse:"https://images.unsplash.com/photo-1507089947368-19c1da9775ae?w=600",Shop:"https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600",Office:"https://images.unsplash.com/photo-1497366216548-37526070297c?w=600",Commercial:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=600"};finalImg=m[type]||m.Plot;}
props.unshift({type,img:finalImg,title,city,price,details,phone});
saveLocal();closeAdd();render(props);

// WhatsApp pe bhejo 9545247374 pe
let msg=`🏠 NAYI PROPERTY AYI HAI\nType: ${type}\nTitle: ${title}\nArea: ${city}\nPrice: ${price}\nPhone: ${phone}\nDetails: ${details}`;
let waUrl=`https://wa.me/919545247374?text=${encodeURIComponent(msg)}`;
window.open(waUrl,"_blank");

document.getElementById("aTitle").value="";document.getElementById("aCity").value="";document.getElementById("aPrice").value="";document.getElementById("aDetails").value="";document.getElementById("aPhone").value="";document.getElementById("aImg").value="";document.getElementById("aFile").value="";
alert("✅ Photo ke saath Add Ho Gayi! WhatsApp pe bhej diya!");
}
render(props);
</script></body></html>
