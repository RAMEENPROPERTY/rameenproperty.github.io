<!DOCTYPE html>
<html>
<head><title>ADMIN - RAMEEN PROPERTY</title>
<script src="https://cdn.tailwindcss.com"></script>
<meta name="robots" content="noindex, nofollow">
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">
<div id="login" class="bg-white p-8 rounded-xl w-full max-w-sm">
<h1 class="text-2xl font-black mb-4 text-center">🔐 ADMIN LOGIN</h1>
<input id="pass" type="password" placeholder="Password likho" class="w-full border p-3 rounded mb-4">
<button onclick="login()" class="w-full bg-blue-900 text-white py-3 rounded font-bold">LOGIN</button>
<p id="err" class="text-red-500 text-sm mt-2 hidden">Galat Password!</p>
</div>

<div id="panel" class="hidden bg-white p-8 rounded-xl w-full max-w-2xl">
<h1 class="text-2xl font-black mb-6">RAMEEN PROPERTY - ADMIN ON</h1>
<p class="bg-green-100 p-3 rounded mb-4">Welcome Boss! Yahan se aap property control karoge.</p>
<div class="grid gap-4">
<input id="pname" placeholder="Property Name: 2BHK Pune" class="border p-3 rounded">
<input id="pprice" placeholder="Price: 50 Lakh" class="border p-3 rounded">
<input id="ploc" placeholder="Location: Wagholi" class="border p-3 rounded">
<button onclick="addProp()" class="bg-yellow-400 py-3 rounded font-black">+ PROPERTY ADD KARO</button>
</div>
<div id="list" class="mt-6"></div>
<button onclick="logout()" class="mt-6 text-red-600 font-bold">LOGOUT</button>
</div>

<script>
const ADMIN_PASS = "9545247374"; // Aapka Password
function login(){
 if(document.getElementById('pass').value === ADMIN_PASS){
   document.getElementById('login').classList.add('hidden');
   document.getElementById('panel').classList.remove('hidden');
   load();
 } else {
   document.getElementById('err').classList.remove('hidden');
 }
}
function addProp(){
  let data = JSON.parse(localStorage.getItem('props')||'[]');
  data.push({name:pname.value, price:pprice.value, loc:ploc.value});
  localStorage.setItem('props', JSON.stringify(data));
  alert('Property Added! Ab index.html me dikhegi');
  load();
}
function load(){
  let data = JSON.parse(localStorage.getItem('props')||'[]');
  list.innerHTML = data.map((p,i)=>`<div class="border p-2 rounded flex justify-between"><span>${p.name} - ${p.price}</span><button onclick="del(${i})" class="text-red-500">Delete</button></div>`).join('');
}
function del(i){ let d=JSON.parse(localStorage.getItem('props')||'[]'); d.splice(i,1); localStorage.setItem('props', JSON.stringify(d)); load(); }
function logout(){ location.reload(); }
</script>
</body>
</html>
