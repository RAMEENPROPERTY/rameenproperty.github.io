<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rameen Property - Admin Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    background: linear-gradient(135deg, #1a1a1a, #111);
    color: #fff; min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
  }
  .login-box {
    background: #222; padding: 40px 30px;
    border-radius: 12px; border: 1px solid #d4a017;
    width: 100%; max-width: 380px;
    box-shadow: 0 10px 40px rgba(212,160,23,0.2);
  }
  .login-box h2 {
    text-align: center; color: #d4a017;
    margin-bottom: 8px; font-size: 24px;
  }
  .login-box p {
    text-align: center; color: #999;
    font-size: 13px; margin-bottom: 25px;
  }
  label {
    display: block; color: #d4a017;
    font-size: 13px; margin-bottom: 6px; margin-top: 15px;
  }
  input {
    width: 100%; padding: 12px;
    background: #1a1a1a; color: #fff;
    border: 1px solid #b8860b; border-radius: 6px;
    font-size: 15px; outline: none;
  }
  input:focus { border-color: #d4a017; box-shadow: 0 0 8px rgba(212,160,23,0.4); }
  button {
    width: 100%; margin-top: 25px;
    background: #d4a017; color: #1a1a1a;
    border: none; padding: 13px;
    border-radius: 6px; font-weight: bold;
    font-size: 16px; cursor: pointer;
  }
  button:hover { background: #f0b429; }
  .error {
    color: #ff5252; text-align: center;
    margin-top: 15px; font-size: 14px;
    display: none;
  }
  .success {
    color: #4caf50; text-align: center;
    margin-top: 15px; font-size: 14px;
    display: none;
  }
  .back {
    display: block; text-align: center;
    color: #999; text-decoration: none;
    margin-top: 20px; font-size: 13px;
  }
  .back:hover { color: #d4a017; }
</style>
</head>
<body>

<div class="login-box">
  <h2>🔐 Rameen Property</h2>
  <p>Admin Panel Login</p>

  <label>👤 Username</label>
  <input type="text" id="username" placeholder="Enter username">

  <label>🔑 Password</label>
  <input type="password" id="password" placeholder="Enter password">

  <button onclick="login()">Login</button>

  <p class="error" id="errorMsg">❌ Galat username ya password!</p>
  <p class="success" id="successMsg">✅ Login successful! Redirecting...</p>

  <a href="index.html" class="back">← Back to Website</a>
</div>

<script>
const ADMIN_USERNAME = "rameen";
const ADMIN_PASSWORD = "property123";

function login() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');

  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';

  if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
    successMsg.style.display = 'block';
    sessionStorage.setItem('rameenAdmin', 'true');
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 1000);
  } else {
    errorMsg.style.display = 'block';
  }
}

document.getElementById('password').addEventListener('keypress', e => {
  if (e.key === 'Enter') login();
});
</script>

</body>
</html>
